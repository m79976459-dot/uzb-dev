<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muhriddin — Bot dasturchi</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#16233a;--muted:#62728c;--blue:#2a7de1;--line:#e3e9f2}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6}
.wrap{max-width:520px;margin:0 auto;padding:36px 18px calc(36px + env(safe-area-inset-bottom))}
.hero{text-align:center;margin-bottom:28px}
.hero .ic{width:68px;height:68px;margin:0 auto 14px;animation:fl 3.2s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
h1{font-size:1.8rem}
.hero p{color:var(--muted);margin-top:4px}
.badge{display:inline-flex;align-items:center;gap:6px;background:#e4efff;color:var(--blue);font-weight:600;font-size:.9rem;padding:6px 14px;border-radius:99px;margin-top:12px}
h2{font-size:1.05rem;margin:28px 0 10px}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);padding:8px 14px;border-radius:12px;font-weight:600;font-size:.92rem}
.chip svg{width:20px;height:20px}
.bot{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:10px;text-decoration:none;color:var(--text);transition:transform .15s}
.bot:active{transform:scale(.97)}
.bot .ic{flex:0 0 52px;height:52px;border-radius:15px;display:flex;align-items:center;justify-content:center;animation:fl 3.2s ease-in-out infinite}
.bot .ic svg{width:30px;height:30px}
.bot b{display:block}
.bot span{color:var(--muted);font-size:.86rem}
.bot .ar{margin-left:auto;color:var(--blue);font-size:1.3rem}
.end{margin-top:34px;padding-top:20px;border-top:1px solid var(--line);text-align:center}
.end p{color:var(--muted);font-size:.9rem;margin-bottom:12px}
.soc{display:flex;flex-direction:column;gap:10px}
.soc a{display:flex;align-items:center;gap:10px;justify-content:center;text-decoration:none;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;font-weight:600}
.soc svg{width:22px;height:22px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
